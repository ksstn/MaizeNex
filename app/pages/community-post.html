<!doctype html>
<html lang="tl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Post</title>
  <link rel="icon" href="../static/img/maizenex logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200;300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../static/css/community-post.css">
</head>

<body>
  <section id="header" class="py-3 shadow-sm">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-9 align-items-center d-flex">
          <button type="button" class="btn btn-light me-2" onclick="window.location.href='community.html'">
            <i class="fa-solid fa-chevron-left"></i>
          </button>
          <span id="title" class="ms-1" data-i18n="community.create_post_title">Gumawa ng Post</span>
        </div>
      </div>
    </div>
  </section>

  <main class="page-content">
    <div class="container py-4">
      <div class="feed-card">
        <!-- <p class="text-muted mb-3" data-i18n="community.create_post_subtitle">Ibahagi sa komunidad</p> -->
        <div class="mb-3">
          <textarea id="postText" class="form-control" rows="4" data-i18n-placeholder="community.create_post_placeholder"
            placeholder="Ibahagi ang update mo..."></textarea>
        </div>
        <div class="d-flex align-items-center gap-2 mb-3" id="photoPickerRow">
         
          <input id="postPhoto" type="file" accept="image/*" hidden>
        </div>
        <div class="composer-preview hidden" id="composerPreview">
          <img id="postPhotoPreview" src="" alt="Selected preview" data-i18n-alt="community.post.image_alt">
        </div>
        <div class="d-flex justify-content-end gap-2">
          <button type="button" class="btn btn-outline-secondary" id="cancelButton" data-i18n="community.create_post_cancel">Kanselahin</button>
          <button type="button" class="btn btn-success" id="postButton" data-i18n="community.create_post_post">I-post</button>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="../static/js/i18n.js"></script>
  <script src="../static/js/community-post.js"></script>
</body>

</html>
