<!doctype html>
<html lang="tl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Account</title>
    <link rel="icon" href="../static/img/maizenex logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200;300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../static/css/me.css">

</head>

<body>

    <!-- Prodile Section -->
    <section class="text-center pt-4 pb-1 shadow position-sticky" id="profile-area">
       <div class="modal-header">
                <button id="backButton" class="btn ms-3  me-3">
                    <i class="fas fa-arrow-left fs-3"></i>
                </button>
                <h5 class="modal-title text-white mb-0" id="scannerModalLabel"></h5>
            </div>
        <div class="profile-wrapper">
            <label for="fileInput" class="profile-box">
                <span class="plus"><img src="../static/img/add-profile.png" class="rounded-circle" alt="Add Image"
                        id="preview"></span>
            </label>
            <input type="file" id="fileInput" accept="image/*" hidden>
        </div>
        <div class="fs-5 text-white fw-bold">
            <p>Your Name Here</p>
        </div>
    </section>

    <section id="account-form">
        <form id="profileForm">
            <div class="container-fluid">

                <div class="mb-2">
                    <label for="emailAddress">Email Address</label><br>
                    <div class="input-wrapper">
                        <input type="email" id="emailAddress" placeholder="Email Address" class="rounded-2 px-2 w-100">
                        <button type="button" class="edit-icon" aria-label="Edit email address">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </button>
                    </div>
                </div>

                <div class="mb-2">
                    <label for="contactNumber">Contact Number</label><br>
                    <div class="input-wrapper">
                        <input type="tel" id="contactNumber" placeholder="Contact Number" class="rounded-2 px-2 w-100">
                        <button type="button" class="edit-icon" aria-label="Edit contact number">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </button>
                    </div>
                </div>

                <div class="mb-2">
                    <label for="address">Address</label><br>
                    <div class="input-wrapper">
                        <input type="text" id="address" placeholder="Address" class="rounded-2 px-2 w-100">
                        <button type="button" class="edit-icon" aria-label="Edit address">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </button>
                    </div>
                </div>

                <div class="mb-2">
                    <label for="gender">Gender</label><br>
                    <div class="input-wrapper">
                        <input type="text" id="gender" placeholder="Gender" class="rounded-2 px-2 w-100">
                        <button type="button" class="edit-icon" aria-label="Edit gender">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </button>
                    </div>
                </div>

                <div class="mb-2">
                    <label for="birthday">Birthday</label><br>
                    <div class="input-wrapper">
                        <input type="date" id="birthday" class="rounded-2 px-2 w-100">
                        <button type="button" class="edit-icon" aria-label="Edit birthday">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </button>
                    </div>
                </div>

                <div class="mb-2">
                    <label for="experience">Years of Experience in Agriculture</label><br>
                    <div class="input-wrapper">
                        <input type="number" id="experience" min="0" placeholder="0" class="rounded-2 px-2 w-100">
                        <button type="button" class="edit-icon" aria-label="Edit years of experience">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </button>
                    </div>
                </div>

                <div class="support-row mb-3">
                    <a href="#" class="support-link" aria-label="Help center">
                        <i class="fa-regular fa-circle-question"></i>
                        <span>Help Center</span>
                    </a>
                    <a href="#" class="support-link" aria-label="Log out">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        <span>Log out</span>
                    </a>
                </div>
            </div>
        </form>
    </section>

    <script src="../static/js/i18n.js"></script>
    <script src="../static/js/create-account.js"></script>
    <script src="../static/js/me.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
