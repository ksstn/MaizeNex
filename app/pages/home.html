<!doctype html>
<html lang="tl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200;300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../static/css/home.css">
    <link rel="stylesheet" href="../static/css/scanner.css">
</head>

<body>

    <section id="header" class="py-3 shadow">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-9 align-items-center d-flex">
                    <img src="../static/img/maizenex logo.png" width="40">
                    <span id="title" class="ms-1">MaizeNex</span>
                </div>
                <div class="col-3 text-end fs-4">
                    <div class="dropdown d-inline">
                        <button class="btn btn-link p-0 text-dark" type="button" data-bs-toggle="dropdown"
                            aria-expanded="false" data-i18n-aria-label="language.change">
                            <i class="fa-solid fa-globe"></i>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><button class="dropdown-item" type="button" data-lang="tl">Tagalog</button></li>
                            <li><button class="dropdown-item" type="button" data-lang="en">English</button></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section id="content">
        
        <!-- weather API -->
        <div class="container">
            <div id="weather-widget" class="p-3">
                <div id="weather-info">
                    <p data-i18n="home.weather.loading">Naglo-load ang panahon...</p>
                </div>
            </div>
        </div>

        <!-- History Section -->
        <div class="container mt-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0" data-i18n="home.history.title">Kasaysayan</h5>
                <button class="btn btn-outline-success rounded-5 py-0" data-i18n="home.history.view_all">Tingnan Lahat</button>
            </div>
            <div class="history-container" style="max-height: 300px; overflow-y: auto;">
                <div class="history-item p-3 border rounded mb-2">
                    <div class="d-flex justify-content-between">
                        <span data-i18n="home.history.item_1">Suri sa panahon - New York</span>
                        <small class="text-muted" data-i18n="home.history.time_1">2 oras ang nakalipas</small>
                    </div>
                </div>
                <div class="history-item p-3 border rounded mb-2">
                    <div class="d-flex justify-content-between">
                        <span data-i18n="home.history.item_2">Suri sa panahon - London</span>
                        <small class="text-muted" data-i18n="home.history.time_2">1 araw ang nakalipas</small>
                    </div>
                </div>
                <div class="history-item p-3 border rounded mb-2">
                    <div class="d-flex justify-content-between">
                        <span data-i18n="home.history.item_3">Suri sa panahon - Tokyo</span>
                        <small class="text-muted" data-i18n="home.history.time_3">3 araw ang nakalipas</small>
                    </div>
                </div>
            </div>
        </div>
    </section>


    <!-- Mobile Navigation Bar -->
    <nav class="navbar fixed-bottom navbar-light bg-light d-md-none">
        <div class="container-fluid">
            <div class="row d-flex justify-content-around align-items-center ">

                <div class="col-1 text-center">
                    <a href="#" class="nav-link d-flex flex-column align-items-center">
                        <i class="fas fa-home fa-lg"></i><br>
                        <small data-i18n="nav.home">Home</small>
                    </a>
                </div>

                <div class="col-1">
                    <a href="community.html" class="nav-link d-flex flex-column align-items-center">
                        <i class="fas fa-users fa-lg"></i><br>
                        <small data-i18n="nav.community">Komunidad</small>
                    </a>
                </div>

                <div class="col-2 ms-3 justify-content-center d-flex">
                    <a href="#" class="nav-link scanner">
                        <div class="scanner-circle">
                            <i class="fa-solid fa-expand"></i>
                        </div>
                    </a>
                </div>

                <div class="col-1">
                    <a href="#" class="nav-link d-flex flex-column align-items-center">
                        <i class="fas fa-lightbulb fa-lg"></i><br>
                        <small data-i18n="nav.facts">Kaalaman</small>
                    </a>
                </div>

                <div class="col-1 me-2 ">
                    <a href="#" class="nav-link d-flex flex-column align-items-center">
                        <i class="fas fa-user fa-lg"></i><br>
                        <small data-i18n="nav.me">Ako</small>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="../static/js/i18n.js"></script>
    <script src="../static/js/scanner.js"></script>
    <script src="../static/js/home.js"></script>
</body>

</html>
