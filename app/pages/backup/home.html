<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200;300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../static/css/home.css">
</head>

<body>

    <section id="header" class="py-3 shadow">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-9 align-items-center d-flex">
                    <img src="../static/img/maizenex logo.png" width="40">
                    <span id="title" class="ms-1">MaizeNex</span>
                </div>
                <div class="col-3 text-end fs-4">
                    <i class="fa-solid fa-globe"></i>
                    <i class="fa-solid fa-bell ms-2"></i>
                </div>
            </div>
        </div>
    </section>

    <section id="content">
        <!-- weather API -->
        <div class="container">
            <div id="weather-widget" class="p-3">
                <div id="weather-info">
                    <p>Loading weather...</p>
                </div>
            </div>
        </div>

        <!-- History Section -->
        <div class="container mt-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0">History</h5>
                <button class="btn btn-outline-success rounded-5 py-0">View All</button>
            </div>
            <div class="history-container" style="max-height: 300px; overflow-y: auto;">
                <div class="history-item p-3 border rounded mb-2">
                    <div class="d-flex justify-content-between">
                        <span>Weather check - New York</span>
                        <small class="text-muted">2 hours ago</small>
                    </div>
                </div>
                <div class="history-item p-3 border rounded mb-2">
                    <div class="d-flex justify-content-between">
                        <span>Weather check - London</span>
                        <small class="text-muted">1 day ago</small>
                    </div>
                </div>
                <div class="history-item p-3 border rounded mb-2">
                    <div class="d-flex justify-content-between">
                        <span>Weather check - Tokyo</span>
                        <small class="text-muted">3 days ago</small>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- history -->
    <section>

    </section>

    <!-- Mobile Navigation Bar -->
    <!-- Mobile Navigation Bar -->
    <nav class="navbar fixed-bottom navbar-light bg-light d-md-none">
        <div class="container-fluid">
            <div class="row d-flex justify-content-around align-items-center ">

                <div class="col-1 text-center">
                    <a href="#" class="nav-link d-flex flex-column align-items-center">
                        <i class="fas fa-home fa-lg"></i><br>
                        <small>Home</small>
                    </a>
                </div>

                <div class="col-1">
                    <a href="#" class="nav-link d-flex flex-column align-items-center">
                        <i class="fas fa-users fa-lg"></i><br>
                        <small>Comm</small>
                    </a>
                </div>

                <div class="col-2 ms-3 justify-content-center d-flex">
                    <a href="#" class="nav-link scanner">
                        <div class="scanner-circle">
                            <i class="fa-solid fa-expand"></i>
                        </div>
                    </a>
                </div>

                <div class="col-1">
                    <a href="#" class="nav-link d-flex flex-column align-items-center">
                        <i class="fas fa-lightbulb fa-lg"></i><br>
                        <small>Facts</small>
                    </a>
                </div>

                <div class="col-1 me-2 ">
                    <a href="#" class="nav-link d-flex flex-column align-items-center">
                        <i class="fas fa-user fa-lg"></i><br>
                        <small>Me</small>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Camera Scanner Modal -->
    <div class="modal fade" id="scannerModal" tabindex="-1" aria-labelledby="scannerModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-fullscreen">
            <div class="modal-content" style="background: rgb(0, 0, 0);">
                <div class="modal-header">
                    <button id="backButton" class="btn btn-outline-light me-3">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <h5 class="modal-title text-white mb-0" id="scannerModalLabel"></h5>
                </div>
                <div class="modal-body p-0 position-relative">
                    <video id="scannerVideo" autoplay playsinline
                        style="width: 100vw; height: 89vh; object-fit: cover;"></video>

                    <!-- Scanner Frame Overlay -->
                    <div class="scanner-overlay">
                        <div class="scanner-frame">
                            <div class="scanner-corner top-left"></div>
                            <div class="scanner-corner top-right"></div>
                            <div class="scanner-corner bottom-left"></div>
                            <div class="scanner-corner bottom-right"></div>
                            <div class="scanner-line horizontal"></div>
                            <div class="scanner-line vertical"></div>
                        </div>
                    </div>

                    <!-- Control Panel -->
                    <div class="control-panel">
                        <p class="instruction-text">Position corn leaf within the scanner frame</p>

                        <div class="container">
                            <div class="row text-end align-items-center">
                                <div class="col-8">
                                    <button id="captureButton" class="btn btn-warning  rounded-circle btn-lg ">
                                        <i class="fa-solid fa-expand"></i></i>
                                    </button>
                                </div>

                                <div class="col">
                                    <button id="uploadButton" class="btn btn-outline-light btn-lg">
                                        <i class="fa-solid fa-image"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                        <p id="scanResult" class="result-text mt-2"></p>
                    </div>

                    <canvas id="scannerCanvas" style="display: none;"></canvas>
                    <input type="file" id="imageUpload" accept="image/*" style="display: none;">

                    <!-- Result Modal Overlay (within scanner) -->
                    <div id="resultModal" class="result-modal-overlay" style="display: none;">
                        <div class="result-modal-content">
                            <div id="resultDragHandle" class="sheet-handle" aria-label="Drag to expand">
                                <span class="sheet-handle-bar"></span>
                            </div>
                            <div class="result-container">
                                <div class="captured-image-container">
                                    <img id="capturedImage" src="" alt="Captured leaf" class="captured-image">
                                </div>
                                <div class="result-details">
                                    <h5 class="result-title">Analysis Result</h5>
                                    <div class="analysis-sections">
                                        <div class="analysis-section">
                                            <h6 class="section-title">Diagnosis</h6>
                                            <p id="resultText" class="result-text"></p>
                                        </div>
                                        <div class="analysis-section">
                                            <h6 class="section-title">Severity Assessment</h6>
                                            <p id="severityText" class="severity-text"></p>
                                        </div>
                                        <div class="analysis-section">
                                            <h6 class="section-title">Recommendation</h6>
                                            <p id="recommendationText" class="recommendation-text"></p>
                                        </div>
                                        <div class="analysis-section">
                                            <h6 class="section-title">Solution</h6>
                                            <p id="solutionText" class="solution-text"></p>
                                        </div>
                                    </div>
                                    <div class="result-actions">
                                        <button id="closeResultButton" class="btn btn-outline-success">Close</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../static/js/home.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
