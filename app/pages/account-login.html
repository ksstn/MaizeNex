<!doctype html>
<html lang="tl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Account Login</title>
    <link rel="icon" href="../static/img/maizenex logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="../static/css/account-login.css">
</head>

<body>
    <section class=" pt-4 pb-5 shadow-lg position-sticky" id="profile-area">
        <button type="button" class="btn btn-light ms-3  mb-4" onclick="window.history.back()"><i
                class="fa-solid fa-chevron-left"></i></button>

        <div class="fs-5 text-white text-center">
            <p data-i18n="login.welcome">Maligayang pagdating sa</p>
            <p id="title" data-i18n="login.title">MaizeNex</p>
            </p>
        </div>
    </section>

    <!-- login -->
    <section id="login">
        <div class="container">
            <form id="loginForm">
                <h5 class="text-center mt-4" data-i18n="login.heading">Mag-log in sa iyong Account</h5>
                <div class="mt-4">
                    <label for="email" data-i18n="login.email">Email Address</label><br>
                    <input type="text" id="email" data-i18n-placeholder="login.email" placeholder="Email Address"
                        class="mt-2 w-100 rounded-2">

                    <div class="mt-2">
                        <label for="password"><span data-i18n="login.password">Password</span> <span class="text-danger">*</span></label><br>
                        <div class="input-wrapper">
                            <input type="password" id="password" data-i18n-placeholder="login.password"
                                placeholder="Password"
                                class="py-0 w-100 mt-2 rounded-2">
                            <span class="toggle-eye mt-1" onclick="togglePassword('password', this)">
                                <i class="fa-solid fa-eye-slash"></i>
                            </span>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <div>
                            <input type="checkbox" id="remember" class="me-1">
                            <label for="remember" data-i18n="login.remember">Tandaan ako</label>
                        </div>
                        <a href="#" class="text-decoration-none" onclick="forgotPassword()" data-i18n="login.forgot">Nakalimutan ang password?</a>
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-success w-75 rounded-4 mt-4"
                            onclick="login(event)" data-i18n="login.button">Mag-log in</button>

                        <p class="mt-2"><span data-i18n="login.no_account">Wala ka pang account?</span> <a href="create-account.html"
                                class="text-decoration-none" data-i18n="login.signup">Mag-sign up</a></p>
                    </div>
                </div>
            </form>
        </div>


    </section>
    <script src="../static/js/i18n.js"></script>
    <script src="../static/js/account-login.js"></script>

</body>

</html>
