<!doctype html>
<html lang="tl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MaizeNex</title>
    <link rel="icon" href="static/img/maizenex logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200;300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


    <style>
        * {
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        html,
        body {
            overflow: hidden;
            margin: 0;
            padding: 0;
            height: 100%;
        }

        #greetings {
            background-image: linear-gradient(rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.6)),
                url('../static/img/corn plants.jpg');
            background-size: cover;
        }

        #title {
            font-family: "Oxanium", sans-serif;
            font-weight: bold;
            font-size: 2em;
            margin: -25px 0 0 0;
            background: linear-gradient(90deg, #e5ff00, #10b030);

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            background-clip: text;
            color: transparent;
        }

        #startBtb {
            font-family: "Poppins", sans-serif;
            font-weight: 500;
            font-size: 1.2em;
        }

        .text1 {
            font-family: "Poppins", sans-serif;
        }

        .welcome-section {
            border-radius: 200px 200px 0 0 / 50px 50px 0 0;
        }

        .text2 {
            text-align: justify;
        }

        .small-text {
            font-size: .8em;
            position: relative;
            top: -15px;
        }
    </style>
</head>

<body>
    <section id="greetings" class="min-vh-100 d-flex flex-column justify-content-between pt-5">
        <div class="container pt-5">
            <div class="row text-center pt-5">
                <div class="col-11 mx-auto text-light pt-5">
                    <div class="fs-5 text1">
                        <img data-i18n="index.welcome" src="../static/img/maizenex logo.png" alt="Welcome"
                            class="mb-3 border border-white rounded-circle" width="80">
                        <p id="title" class="pt-1">MaizeNex</p>
                        <span class="small-text">Web-application</span>

                    </div>
                </div>
            </div>
        </div>

        <section class="border border-white welcome-section bg-light bg-opacity-90 pb-3">
            <div class="container-fluid pt-5 text-dark text-center text1">
                <h5 class="fs-2 fw-bold" data-i18n="index.welcome">MABUHAY!</h5>
                <p class="fs-6 pt-3 text2 px-3">
                    Ang aplikasyon na ito ay katulong upang mapabilis sa pagsubaybay at pag-alaga ng mga mais.
                </p>
                <div class="text-center mb-4 mt-4">
                    <a href="create-account.html" class="btn btn-success rounded-5 px-5 py-2 shadow" id="startBtb">
                        Simulan</i>
                    </a>
                </div>
            </div>

        </section>

    </section>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="static/js/i18n.js"></script>
</body>

</html>
